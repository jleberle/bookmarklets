name: build

# The build only reads src/ and build.js and only asserts dist/ is current,
# so README/LICENSE edits have nothing to verify. Scoped to main so pushes to
# throwaway branches don't queue a runner either.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node build.js
      - name: Verify dist/ is up to date
        run: git diff --exit-code -- dist/
