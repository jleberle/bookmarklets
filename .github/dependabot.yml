version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Keep SHA-pinned workflow actions current with reviewable PRs.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
